services:
  web:
    build: ../dockerfile/node-app
    ports:
      - "8080:8080"
    environment:
      APP_MSG: "with db draft"
      PORT: "8080"
    depends_on:
      - db

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: example
      POSTGRES_DB: appdb
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
