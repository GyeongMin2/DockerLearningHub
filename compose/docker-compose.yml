services:
  web:
    build: ../dockerfile/node-app
    ports:
      - "8080:8080"
    environment:
      APP_MSG: "compose로 띄움"
      PORT: "8080"
    restart: unless-stopped
    volumes:
      - webdata:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  webdata:
